name: Release Windows build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag containing reviewed code
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected vX.Y.Z tag' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .\mcp\requirements.txt
      - run: .\build.ps1 -Package
      - run: .\build.ps1 -Architecture arm64 -Package
      - run: python -m unittest discover -s tests -v
      - name: Create reviewed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          Get-FileHash .\artifacts\desktop-rescue-win-*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
          gh release create $env:RELEASE_TAG .\artifacts\desktop-rescue-win-x64.zip .\artifacts\desktop-rescue-win-arm64.zip .\artifacts\SHA256SUMS.txt --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
